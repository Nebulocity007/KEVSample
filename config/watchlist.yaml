# Watchlist: technologies assumed common in financial-institution estates.
#
# SOURCING - read this before quoting anything from the brief:
#   * WHICH products are listed and HOW MUCH each weighs is analyst judgment.
#     It has NOT been validated against member inventories, surveys or
#     internet-exposure data. Every entry says so: `prevalence: analyst-judgment`.
#     (See README "Watchlist provenance" for how to validate it.)
#   * `evidence` lists KEV CVE IDs showing the product family is actively
#     exploited. These are machine-checked: every ID must exist in the loaded
#     KEV data AND match this entry at product level (fin_ti/score.py
#     verify_evidence; run `python -m fin_ti score`).
#   * `advisories` are optional public CISA advisories. They are not checked
#     automatically (offline-first), so re-check URLs before external use.
#   * `rationale` is a one-line judgment of why the product matters to FS.
#
# Matching (fin_ti/score.py): case-insensitive whole-word match of `vendor` in
# KEV vendorProject and of any `products` keyword in KEV product.
#   product match              -> full `weight`
#   vendor match only          -> flat `vendor_only_points`
#   internet_facing + product  -> +`internet_facing_points`

vendor_only_points: 10
internet_facing_points: 15

entries:
  # --- Edge / remote access (VPN, ADC, firewalls) --------------------------
  - id: citrix-netscaler
    vendor: Citrix
    products: [NetScaler, ADC, Gateway]
    category: edge
    internet_facing: true
    weight: 40
    prevalence: analyst-judgment
    evidence: [kev:CVE-2023-4966, kev:CVE-2025-5777]
    advisories: [https://www.cisa.gov/news-events/cybersecurity-advisories/aa23-325a]
    rationale: Common remote-access front end; LockBit affiliates exploited Citrix Bleed (AA23-325A).
  - id: fortinet-edge
    vendor: Fortinet
    products: [FortiOS, FortiGate, FortiProxy, FortiManager, FortiWeb, FortiClient EMS]
    category: edge
    internet_facing: true
    weight: 40
    prevalence: analyst-judgment
    evidence: [kev:CVE-2018-13379, kev:CVE-2024-55591]
    rationale: Assumed common firewall/VPN at mid-size institutions; repeat KEV vendor.
  - id: ivanti-edge
    vendor: Ivanti
    products: [Connect Secure, Policy Secure, Pulse, EPMM, Endpoint Manager]
    category: edge
    internet_facing: true
    weight: 40
    prevalence: analyst-judgment
    evidence: [kev:CVE-2024-21887, kev:CVE-2025-0282]
    advisories: [https://www.cisa.gov/news-events/cybersecurity-advisories/aa24-060b]
    rationale: Widely deployed VPN; repeated mass-exploitation waves (AA24-060B).
  - id: paloalto-panos
    vendor: Palo Alto Networks
    products: [PAN-OS, GlobalProtect, Expedition]
    category: edge
    internet_facing: true
    weight: 40
    prevalence: analyst-judgment
    evidence: [kev:CVE-2024-3400]
    rationale: Assumed standard perimeter firewall at large institutions.
  - id: cisco-edge
    vendor: Cisco
    products: [ASA, Adaptive Security, Firepower, FTD, IOS XE, AnyConnect, Secure Client, ISE]
    category: edge
    internet_facing: true
    weight: 35
    prevalence: analyst-judgment
    evidence: [kev:CVE-2023-20198]
    rationale: Assumed network/VPN backbone across the sector.
  - id: f5-bigip
    vendor: F5
    products: [BIG-IP]
    category: edge
    internet_facing: true
    weight: 35
    prevalence: analyst-judgment
    evidence: [kev:CVE-2022-1388]
    rationale: Load balancer commonly placed in front of customer-facing web apps and APIs.
  - id: sonicwall
    vendor: SonicWall
    products: [SonicOS, SMA, SSLVPN]
    category: edge
    internet_facing: true
    weight: 30
    prevalence: analyst-judgment
    evidence: [kev:CVE-2024-40766]
    rationale: Assumed common at smaller institutions; KEV lists known ransomware use.
  - id: checkpoint
    vendor: Check Point
    products: [Quantum, Security Gateway, CloudGuard]
    category: edge
    internet_facing: true
    weight: 30
    prevalence: analyst-judgment
    evidence: [kev:CVE-2024-24919]
    rationale: Enterprise firewall/VPN.

